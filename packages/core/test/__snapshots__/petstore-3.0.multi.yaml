openapi: 3.0.3
info:
  title: Petstore
  version: 1.0.0
  description: A small OpenAPI fixture for snapshot testing.
servers:
  - url: https://petstore.example.com/v1
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            maximum: 100
      responses:
        '200':
          description: A paged array of pets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pets'
      x-codeSamples:
        - lang: Shell + Curl
          source: |-
            curl --request GET \
              --url 'https://petstore.example.com/v1/pets?limit=100'
        - lang: Node + Native
          source: |-
            const http = require('https');

            const options = {
              method: 'GET',
              hostname: 'petstore.example.com',
              port: null,
              path: '/v1/pets?limit=100',
              headers: {}
            };

            const req = http.request(options, function (res) {
              const chunks = [];

              res.on('data', function (chunk) {
                chunks.push(chunk);
              });

              res.on('end', function () {
                const body = Buffer.concat(chunks);
                console.log(body.toString());
              });
            });

            req.end();
        - lang: Python + Requests
          source: |-
            import requests

            url = "https://petstore.example.com/v1/pets"

            querystring = {"limit":"100"}

            response = requests.get(url, params=querystring)

            print(response.json())
    post:
      operationId: createPet
      summary: Create a pet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Null response
      x-codeSamples:
        - lang: Shell + Curl
          source: |-
            curl --request POST \
              --url https://petstore.example.com/v1/pets \
              --header 'content-type: application/json' \
              --data '{"id":0,"name":"string","tag":"string"}'
        - lang: Node + Native
          source: |-
            const http = require('https');

            const options = {
              method: 'POST',
              hostname: 'petstore.example.com',
              port: null,
              path: '/v1/pets',
              headers: {
                'content-type': 'application/json'
              }
            };

            const req = http.request(options, function (res) {
              const chunks = [];

              res.on('data', function (chunk) {
                chunks.push(chunk);
              });

              res.on('end', function () {
                const body = Buffer.concat(chunks);
                console.log(body.toString());
              });
            });

            req.write(JSON.stringify({id: 0, name: 'string', tag: 'string'}));
            req.end();
        - lang: Python + Requests
          source: |-
            import requests

            url = "https://petstore.example.com/v1/pets"

            payload = {
                "id": 0,
                "name": "string",
                "tag": "string"
            }
            headers = {"content-type": "application/json"}

            response = requests.post(url, json=payload, headers=headers)

            print(response.json())
  /pets/{petId}:
    get:
      operationId: showPetById
      summary: Info for a specific pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Expected response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codeSamples:
        - lang: Shell + Curl
          source: |-
            curl --request GET \
              --url https://petstore.example.com/v1/pets/string
        - lang: Node + Native
          source: |-
            const http = require('https');

            const options = {
              method: 'GET',
              hostname: 'petstore.example.com',
              port: null,
              path: '/v1/pets/string',
              headers: {}
            };

            const req = http.request(options, function (res) {
              const chunks = [];

              res.on('data', function (chunk) {
                chunks.push(chunk);
              });

              res.on('end', function () {
                const body = Buffer.concat(chunks);
                console.log(body.toString());
              });
            });

            req.end();
        - lang: Python + Requests
          source: |-
            import requests

            url = "https://petstore.example.com/v1/pets/string"

            response = requests.get(url)

            print(response.json())
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      type: array
      items:
        $ref: '#/components/schemas/Pet'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        id:
          type: integer
          format: int32
        code:
          type: integer
          format: int32
        message:
          type: string
